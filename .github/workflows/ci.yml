name: Scientific pipeline checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    env:
      WEKA_JAR: .tools/weka/weka-stable-3.8.6.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen faersight validate-config config/experiment.example.yaml
      - run: uv run --frozen faersight validate-config config/experiment.yaml --require-frozen
      - run: bash scripts/setup_weka.sh
      - run: uv run --frozen python -m pytest -q --junitxml=artifacts/generated/tests.xml
      - run: uv run --frozen faersight reproduce-fixture --jar "$WEKA_JAR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evidence
          path: artifacts/generated/
