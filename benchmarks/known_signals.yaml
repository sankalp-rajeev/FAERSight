  - {drug: simvastatin, reaction: RHABDOMYOLYSIS, source: zocor_2023}
  - {drug: pravastatin, reaction: MYOPATHY, source: pravachol_2022}
  - {drug: pravastatin, reaction: RHABDOMYOLYSIS, source: pravachol_2022}
